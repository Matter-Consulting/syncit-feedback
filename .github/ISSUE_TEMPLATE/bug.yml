# The fields are the app's (matter-toolbox lib/feedback.py KINDS["bug"]): an id is the link's
# query parameter, a label the "###" heading the app writes. Change both together.
name: Bug
description: Something in SYNCIT does not work as it should.
labels: ["kind:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: >-
        **This repository is public: leave out client and project names, drawings, model files,
        file paths under your user folder and email addresses.**
        The chat in SYNCIT can write this for you and shows you the text before it is sent.
  - type: input
    id: area
    attributes:
      label: Area
      description: >-
        syncit (the app's pages, tasks and exports), matter-toolbox (the window, navbar, settings
        and project list), chat (the chat panel), calculations (columns, strut and tie, pile caps),
        or not sure.
      placeholder: syncit
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What were you doing?
      description: The task or button, in your own words.
      placeholder: Run Task on Push To ETABS, after changing a column type's bars.
  - type: input
    id: page
    attributes:
      label: Page
      description: The page's name and what kind of page it is. Not the project's name.
      placeholder: CC10 (a column type page)
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: happened
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: The app's words
      description: >-
        The app's own message, word for word: the run card's stop text, a notice, a log line.
        Read it for paths and names first.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: >-
        Anything that helps and is not confidential. A screenshot only of the app's own screens,
        with nothing of a client's drawing or model in it.
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: >-
        The chat fills this in. Otherwise: the app's version from the exe's name
        (SYNCIT_v1.1.0.18_production) and your Windows version.
      render: text
